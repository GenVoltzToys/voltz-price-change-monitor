VOLTZ TOYS PRICE & SALES PACE DUAL-DIMENSION SYSTEM - REVISION HISTORY

  function parseCSV(text) {
    const rows = [];
    let currentRow = [];
    let currentVal = '';
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];

      if (char === '"') {
        if (insideQuotes && nextChar === '"') {
          currentVal += '"';
          i++;
        } else {
          insideQuotes = !insideQuotes;
        }
      } else if (char === ',' && !insideQuotes) {
        currentRow.push(currentVal.trim());
        currentVal = '';
      } else if ((char === '\r' || char === '\n') && !insideQuotes) {
        if (char === '\r' && nextChar === '\n') i++;
        currentRow.push(currentVal.trim());
        if (currentRow.some(c => c.length > 0)) rows.push(currentRow);
        currentRow = [];
        currentVal = '';
      } else {
        currentVal += char;
      }
    }
    if (currentVal.length > 0 || currentRow.length > 0) {
      currentRow.push(currentVal.trim());
      if (currentRow.some(c => c.length > 0)) rows.push(currentRow);
    }
    return rows;
  }

  function MultiSelect({ title, options, selected, onChange }) {
    const [open, setOpen] = useState(false);
    const ref = useRef(null);

    useEffect(() => {
      const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
      document.addEventListener('mousedown', handler);
      return () => document.removeEventListener('mousedown', handler);
    }, []);

    const toggle = (opt) => {
      if (selected.includes(opt)) {
        if (selected.length > 1) onChange(selected.filter(x => x !== opt));
      } else {
        onChange([...selected, opt]);
      }
    };

    return (
      <div className="relative inline-block" ref={ref}>

      try {
        if (salesData.length > 0) localStorage.setItem(STORAGE_KEY_SALES, JSON.stringify(salesData));
      } catch (e) {}
    }, [salesData]);

    useEffect(() => {
      try {
        localStorage.setItem(STORAGE_KEY_PRICES, JSON.stringify(priceData));
      } catch (e) {}
    }, [priceData]);

    useEffect(() => {
      try {
        localStorage.setItem(STORAGE_KEY_ENABLED_SKUS, JSON.stringify(enabledSkus));
      } catch (e) {}
    }, [enabledSkus]);

    useEffect(() => {
      try {
        localStorage.setItem(STORAGE_KEY_INVENTORY, JSON.stringify(inventoryMap));
        localStorage.setItem(STORAGE_KEY_INV_DATE, inventoryExportTime);
      } catch (e) {}
    }, [inventoryMap, inventoryExportTime]);

    const handleResetStorage = () => {
      if (confirm('确认清空已保存的上传数据（含库存）与选择状态，恢复默认初始库吗？')) {
        localStorage.removeItem(STORAGE_KEY_SALES);
        localStorage.removeItem(STORAGE_KEY_PRICES);
        localStorage.removeItem(STORAGE_KEY_ENABLED_SKUS);
        localStorage.removeItem(STORAGE_KEY_INVENTORY);
        localStorage.removeItem(STORAGE_KEY_INV_DATE);
        setSalesData([]);
        setPriceData(DEFAULT_PRICE_HISTORY);
        setInventoryMap({});
        setInventoryExportTime('');
        setAllSkusList(defaultSkus);
        setEnabledSkus(defaultSkus);
        alert('已成功重置！');
      }
    };

    const toggleSkuEnabled = (sku) => {
      setEnabledSkus(prev => prev.includes(sku) ? prev.filter(s => s !== sku) : [...prev, sku]);
    };

    const toggleSelectAll = (checked) => {
      setEnabledSkus(checked ? [...allSkusList] : []);
    };

    const getPriceAtDate = (sku, targetDate) => {
      const history = priceData
        .filter(p => p.sku === sku)
        .sort((a, b) => a.date.localeCompare(b.date));

      if (history.length === 0) return 0;
      let p = history[0].price;
      for (const log of history) {
        if (targetDate > log.date) {
          p = log.price;
        }
      }
      return p;
    };

    useEffect(() => {
      setCheckedPrice(getPriceAtDate(detailSku, queryDate));
    }, [detailSku, queryDate, priceData]);

    const timeIntervals = useMemo(() => {
      if (salesData.length === 0) {
        return [
          { id: 'P1', start: '2026-09-01', end: '2026-09-17', label: 'P1 (09-01~09-17)' },
          { id: 'P2', start: '2026-09-18', end: '2026-09-24', label: 'P2 (09-18~09-24)' }
        ];
      }

      const validDates = salesData.map(s => s.date).filter(Boolean).sort();
      if (validDates.length === 0) return [];
      const minDate = validDates[0];
      const maxDate = validDates[validDates.length - 1];

      const validCuts = cutDates.filter(d => d >= minDate && d < maxDate).sort();
      const intervals = [];
      let currStart = minDate;

      validCuts.forEach((cutDate, idx) => {
        intervals.push({
          id: `P${idx + 1}`,
          start: currStart,
          end: cutDate,
          label: `P${idx + 1} (${currStart.slice(5)}~${cutDate.slice(5)})`
        });
        const next = new Date(cutDate);
        next.setDate(next.getDate() + 1);
        currStart = next.toISOString().split('T')[0];
      });

      if (currStart <= maxDate) {
        intervals.push({
          id: `P${validCuts.length + 1}`,
          start: currStart,
          end: maxDate,
          label: `P${validCuts.length + 1} (${currStart.slice(5)}~${maxDate.slice(5)})`
        });
      }
      return intervals;
    }, [salesData, cutDates]);

    useEffect(() => {
      if (timeIntervals.length > 1) {
        setSelectedCompareIdx(timeIntervals.length - 1);
      }
    }, [timeIntervals]);

    // CSV 上传解析器
    const handleCsvUpload = (e, type) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const text = evt.target.result;
        const rows = parseCSV(text);
        if (rows.length <= 1) return;

        if (type === 'sales') {
          const headers = rows[0].map(h => h.trim());
          const dateIdx = headers.indexOf('Date');
          const skuIdx = headers.indexOf('Product') !== -1 ? headers.indexOf('Product') : headers.indexOf('sku');
          const channelIdx = headers.indexOf('Base Channel') !== -1 ? headers.indexOf('Base Channel') : headers.indexOf('channel');
          const accountIdx = headers.indexOf('Account') !== -1 ? headers.indexOf('Account') : headers.indexOf('account');
          const statusIdx = headers.indexOf('Status') !== -1 ? headers.indexOf('Status') : headers.indexOf('status');
          const revIdx = headers.indexOf('Gross Revenue') !== -1 ? headers.indexOf('Gross Revenue') : headers.indexOf('rev');

          const cleanSales = [];
          const chSet = new Set();
          const accSet = new Set();

          for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            const dateVal = r[dateIdx];
            const skuVal = r[skuIdx];
            if (!dateVal || !skuVal || dateVal.length < 8) continue;

            const ch = r[channelIdx] || 'Other';
            const acc = r[accountIdx] || 'Other';
            const status = r[statusIdx] || '';
            const rev = parseFloat(r[revIdx]) || 0;

            cleanSales.push({ date: dateVal, sku: skuVal, channel: ch, account: acc, status, qty: 1, rev });
            chSet.add(ch);
            accSet.add(acc);
          }

          setSalesData(cleanSales);
          setAllChannels(Array.from(chSet));
          setAllAccounts(Array.from(accSet));
          alert(`成功导入销售 Raw Data: ${cleanSales.length} 条记录！数据已自动保存在本地。`);
        } else if (type === 'prices') {
          const cleanPrices = [];
          const newCuts = new Set(cutDates);

          for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            const sku = r[0];
            const date = r[1];
            const price = parseFloat(r[2]) || 0;
            const itemType = r[4] || 'Ride-on Car';

            if (sku && date) {
              cleanPrices.push({ sku, date, price, itemType });
              newCuts.add(date);
            }
          }

          setPriceData(prev => [...prev, ...cleanPrices]);
          setCutDates(Array.from(newCuts));
          alert(`成功追加调价记录: ${cleanPrices.length} 条！数据已自动保存在本地。`);
        } else if (type === 'inventory') {
          // 处理带有导出前置时间戳的库存文件
          let headerRowIdx = -1;
          let detectedTime = '';

          for (let i = 0; i < Math.min(rows.length, 5); i++) {
            const rowStr = rows[i].join(',');
            if (rowStr.includes('Time of export:')) {
              detectedTime = rows[i][0].replace(/.*Time of export:\s*/i, '').trim();
            }
            if (rows[i].includes('Product ID') || rows[i].includes('Product Name') || rows[i].includes('Quantity in Warehouse')) {
              headerRowIdx = i;
              break;
            }
          }

          if (headerRowIdx === -1) {
            alert('未能识别库存文件的表头结构，请确保包含 Product ID 及库存列。');
            return;
          }

          const headers = rows[headerRowIdx].map(h => h.trim());
          const prodIdIdx = headers.indexOf('Product ID') !== -1 ? headers.indexOf('Product ID') : headers.indexOf('SKU');
          const whIdx = headers.indexOf('Quantity in Warehouse');
          const resIdx = headers.indexOf('Quantity Reserved');
          const incIdx = headers.indexOf('Quantity Incoming');
          const availIdx = headers.indexOf('Quantity Available');

          const invMap = {};
          let recordCount = 0;

          for (let i = headerRowIdx + 1; i < rows.length; i++) {
            const r = rows[i];
            const prod = (r[prodIdIdx] || '').trim();
            if (!prod) continue;

            const wh = parseFloat(r[whIdx]) || 0;
            const res = parseFloat(r[resIdx]) || 0;
            const inc = parseFloat(r[incIdx]) || 0;
            const avail = parseFloat(r[availIdx]) || 0;

            if (!invMap[prod]) {
              invMap[prod] = {
                'Quantity in Warehouse': 0,
                'Quantity Reserved': 0,
                'Quantity Incoming': 0,
                'Quantity Available': 0
              };
            }

            invMap[prod]['Quantity in Warehouse'] += wh;
            invMap[prod]['Quantity Reserved'] += res;
            invMap[prod]['Quantity Incoming'] += inc;
            invMap[prod]['Quantity Available'] += avail;
            recordCount++;
          }

          setInventoryMap(invMap);
          if (detectedTime) setInventoryExportTime(detectedTime);
          alert(`成功解析库存数据！共聚合汇总 ${recordCount} 条单品变体记录。\n导出基准时间: ${detectedTime || '未检测到，已载入'}`);
        }
      };
      reader.readAsText(file);
    };

    // Tab 1 全量数据
    const rawTableRows = useMemo(() => {
      return allSkusList.map(sku => {
        const itemType = priceData.find(p => p.sku === sku)?.itemType || 'Ride-on Car';

        const skuSales = salesData.filter(s =>
          s.sku === sku &&
          selectedChannels.includes(s.channel) &&
          selectedAccounts.includes(s.account) &&
          (!onlyPositive || isPositiveStatus(s.status))
        );

        let prevSpeed = null;

        const intervalMetrics = timeIntervals.map((inter, idx) => {
          const inRange = skuSales.filter(s => s.date >= inter.start && s.date <= inter.end);
          const val = inRange.reduce((acc, cur) => acc + cur.rev, 0);
          const count = inRange.reduce((acc, cur) => acc + cur.qty, 0);
          const days = Math.max(1, Math.ceil((new Date(inter.end) - new Date(inter.start)) / 86400000) + 1);

          const avgSpeed = Number((count / days).toFixed(2));
          const activePrice = getPriceAtDate(sku, inter.end);

          let diffWithPrev = null;
          if (idx > 0 && prevSpeed !== null) {
            diffWithPrev = Number((avgSpeed - prevSpeed).toFixed(2));
          }
          prevSpeed = avgSpeed;

          return {
            id: inter.id,
            val: Number(val.toFixed(2)),
            count: Number(count.toFixed(2)),
            avgSpeed: Number(avgSpeed.toFixed(2)),
            diffWithPrev,
            activePrice
          };
        });

        const firstP = intervalMetrics[0]?.activePrice || 0;
        const lastP = intervalMetrics[intervalMetrics.length - 1]?.activePrice || 0;
        const priceChangePct = firstP > 0 ? Number((((lastP - firstP) / firstP) * 100).toFixed(1)) : 0;

        const firstSpeed = intervalMetrics[0]?.avgSpeed || 0;
        const lastSpeed = intervalMetrics[intervalMetrics.length - 1]?.avgSpeed || 0;
        const totalSpeedDiff = Number((lastSpeed - firstSpeed).toFixed(2));

        const isEnabled = enabledSkus.includes(sku);

        // 库存与消耗天数测算 (采用最新区间的出货速度)
        const currentInv = inventoryMap[sku] ? (inventoryMap[sku][selectedInvMetric] || 0) : null;
        let daysToExhaust = null;
        if (currentInv !== null) {
          if (lastSpeed > 0) {
            daysToExhaust = Number((currentInv / lastSpeed).toFixed(1));
          } else {
            daysToExhaust = currentInv > 0 ? 99999 : 0; // 99999 代表停滞不可消耗
          }
        }

        return {
          sku,
          itemType,
          intervalMetrics,
          priceChangePct,
          totalSpeedDiff,
          isEnabled,
          currentInv,
          daysToExhaust,
          latestSpeed: lastSpeed
        };
      });
    }, [allSkusList, salesData, priceData, timeIntervals, selectedChannels, selectedAccounts, onlyPositive, enabledSkus, inventoryMap, selectedInvMetric]);

    // 搜索与排序
    const sortedAndFilteredRows = useMemo(() => {
      let result = [...rawTableRows];

      if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        result = result.filter(r => r.sku.toLowerCase().includes(q) || r.itemType.toLowerCase().includes(q));
      }

      if (sortConfig.key) {
        result.sort((a, b) => {
          let valA, valB;
          if (sortConfig.key === 'sku') {
            valA = a.sku; valB = b.sku;
            return sortConfig.direction === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
          } else if (sortConfig.key === 'itemType') {
            valA = a.itemType; valB = b.itemType;
            return sortConfig.direction === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
          } else if (sortConfig.key === 'currentInv') {
            valA = a.currentInv ?? -999999;
            valB = b.currentInv ?? -999999;
            return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
          } else if (sortConfig.key === 'daysToExhaust') {
            valA = a.daysToExhaust ?? -999999;
            valB = b.daysToExhaust ?? -999999;
            return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
          } else {
            const mA = a.intervalMetrics.find(m => m.id === sortConfig.intervalId);
            const mB = b.intervalMetrics.find(m => m.id === sortConfig.intervalId);
            valA = mA ? (mA[sortConfig.key] ?? -999999) : -999999;
            valB = mB ? (mB[sortConfig.key] ?? -999999) : -999999;
            return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
          }
        });
      }
      return result;
    }, [rawTableRows, searchQuery, sortConfig]);

    const activeEnabledRows = useMemo(() => {
      return sortedAndFilteredRows.filter(r => r.isEnabled);
    }, [sortedAndFilteredRows]);

    const velocitySummary = useMemo(() => {
      let speedUp = 0;
      let speedDown = 0;
      let speedFlat = 0;
      let totalUpDiff = 0;
      let totalDownDiff = 0;

      activeEnabledRows.forEach(r => {
        if (r.totalSpeedDiff > 0) {
          speedUp++;
          totalUpDiff += r.totalSpeedDiff;
        } else if (r.totalSpeedDiff < 0) {
          speedDown++;
          totalDownDiff += Math.abs(r.totalSpeedDiff);
        } else {
          speedFlat++;
        }
      });

      const avgUp = speedUp > 0 ? (totalUpDiff / speedUp).toFixed(2) : '0.00';
      const avgDown = speedDown > 0 ? (totalDownDiff / speedDown).toFixed(2) : '0.00';

      return { speedUp, speedDown, speedFlat, avgUp, avgDown, totalActive: activeEnabledRows.length };
    }, [activeEnabledRows]);

    const handleSort = (key, intervalId = null) => {
      setSortConfig(prev => {
        if (prev.key === key && prev.intervalId === intervalId) {
          return { key, intervalId, direction: prev.direction === 'asc' ? 'desc' : 'asc' };
        }
        return { key, intervalId, direction: 'desc' };
      });
    };

    const handleExportCSV = () => {
      if (activeEnabledRows.length === 0) {
        alert('当前暂无可导出的已勾选数据');
        return;
      }

      let headerRow1 = ['基础信息', '', '库存与去化', ''];
      let headerRow2 = ['SKU', '品类', `${selectedInvMetric}`, '消耗完天数(天)'];

      timeIntervals.forEach((inter, idx) => {
        if (idx === 0) {
          headerRow1.push(inter.label, '', '');
          headerRow2.push('价格($)', '销量(件)', '日均出货速度(件/天)');
        } else {
          headerRow1.push(inter.label, '', '', '');
          headerRow2.push('价格($)', '销量(件)', '日均出货速度(件/天)', 'Diff(vs上区间)');
        }
      });

      const csvContent = [];
      csvContent.push(headerRow1.join(','));
      csvContent.push(headerRow2.join(','));

      activeEnabledRows.forEach(r => {
        const invStr = r.currentInv !== null ? r.currentInv : '-';
        const exhaustStr = r.daysToExhaust !== null ? (r.daysToExhaust >= 99999 ? '∞ (停滞)' : r.daysToExhaust) : '-';
        const row = [r.sku, r.itemType, invStr, exhaustStr];
        r.intervalMetrics.forEach((m, idx) => {
          row.push(m.activePrice.toFixed(2));
          row.push(m.count.toFixed(2));
          row.push(m.avgSpeed.toFixed(2));
          if (idx > 0) {
            row.push(m.diffWithPrev !== null ? (m.diffWithPrev >= 0 ? `+${m.diffWithPrev.toFixed(2)}` : m.diffWithPrev.toFixed(2)) : '-');
          }
        });
        csvContent.push(row.map(val => `"${val}"`).join(','));
      });

      const blob = new Blob(['\uFEFF' + csvContent.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `Voltz_Toys_Price_Sales_Inventory_Report_${CURRENT_REV}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    };

    const handleDownloadRevHistory = () => {
      const blob = new Blob([REV_HISTORY_TEXT], { type: 'text/plain;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Voltz_Toys_Rev_History_${CURRENT_REV}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    };

    // --- TAB 2 图表渲染 ---
    const renderTab2Chart = () => {
      if (!chartRef.current) return;
      if (!chartInst.current) {
        chartInst.current = echarts.init(chartRef.current);
      }

      const currentDetail = sortedAndFilteredRows.find(r => r.sku === detailSku) || sortedAndFilteredRows[0];
      const xAxisLabels = timeIntervals.map(t => t.label);
      const barData = currentDetail?.intervalMetrics.map(m => m.avgSpeed) || [0, 0];
      const lineData = currentDetail?.intervalMetrics.map(m => m.activePrice) || [100, 100];

      const invVal = currentDetail?.currentInv !== null && currentDetail?.currentInv !== undefined ? currentDetail.currentInv : '--';
      const exhaustText = currentDetail?.daysToExhaust !== null && currentDetail?.daysToExhaust !== undefined 
        ? (currentDetail.daysToExhaust >= 99999 ? '∞ (停滞)' : `${currentDetail.daysToExhaust} 天`) 
        : '--';

      const option = {
        backgroundColor: '#0f172a',
        textStyle: { fontFamily: '"Calibre", "Calibri", "Microsoft YaHei", sans-serif' },
        title: {
          text: `${detailSku} 调价阶梯与出货速度对比图`,
          subtext: `当前匹配库存(${selectedInvMetric}): ${invVal} 件 | 按最新调整后速度(${currentDetail?.latestSpeed || 0}件/天) 预计消耗: ${exhaustText}`,
          textStyle: { color: '#f8fafc', fontSize: 13, fontWeight: 700 },
          subtextStyle: { color: 'var(--primary)', fontSize: 11, fontWeight: 600 },
          left: 10, top: 10
        },
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'cross', lineStyle: { color: '#475569' } },
          backgroundColor: '#1e293b',
          borderColor: '#475569',
          textStyle: { color: '#f8fafc', fontFamily: '"Calibre", "Calibri", "Microsoft YaHei"' }
        },
        legend: {
          data: ['生效价格 (阶梯)', '区间日均出货速度 (AVG Count/DAY)'],
          top: 10,
          right: 20,
          textStyle: { color: '#94a3b8', fontWeight: 600, fontFamily: '"Calibre", "Calibri", "Microsoft YaHei"' }
        },
        grid: { left: '4%', right: '5%', bottom: '10%', top: '22%', containLabel: true },
        xAxis: {
          type: 'category',
          data: xAxisLabels,
          axisLine: { lineStyle: { color: '#475569' } },
          axisLabel: { color: '#94a3b8', fontSize: 12, fontFamily: '"Calibre", "Calibri"' }
        },
        yAxis: [
          {
            type: 'value',
            name: '价格 ($)',
            position: 'left',
            axisLabel: { formatter: '${value}', color: '#94a3b8', fontFamily: '"Calibre", "Calibri"' },
            splitLine: { show: false }
          },
          {
            type: 'value',
            name: '日均销量 (件/天)',
            position: 'right',
            axisLabel: { formatter: '{value}', color: '#94a3b8', fontFamily: '"Calibre", "Calibri"' },
            splitLine: { lineStyle: { type: 'dashed', color: 'rgba(71,85,105,0.4)' } }
          }
        ],
        series: [
          {
            name: '区间日均出货速度 (AVG Count/DAY)',
            type: 'bar',
            yAxisIndex: 1,
            barWidth: '35%',
            data: barData,
            itemStyle: { color: '#38bdf8', borderRadius: [4, 4, 0, 0] },
            label: {
              show: true,
              position: 'top',
              formatter: (params) => Number(params.value).toFixed(2) + ' 件/天',
              color: '#38bdf8',
              fontWeight: 700,
              fontFamily: '"Calibre", "Calibri"'
            }
          },
          {
            name: '生效价格 (阶梯)',
            type: 'line',
            step: 'end',
            yAxisIndex: 0,
            data: lineData,
            lineStyle: { width: 3, color: '#f59e0b' },
            itemStyle: { color: '#f59e0b', borderWidth: 2, borderColor: '#0f172a' }
          }
        ]
      };

      chartInst.current.setOption(option, true);
      chartInst.current.resize();
    };

    // --- TAB 3 图表渲染 ---
    const renderTab3Charts = () => {
      // 1. 散点象限图
      if (scatterRef.current) {
        if (!scatterInst.current) {
          scatterInst.current = echarts.init(scatterRef.current);
        }

        const scatterData = activeEnabledRows.map(r => [
          r.priceChangePct,
          r.totalSpeedDiff,
          r.sku,
          r.itemType
        ]);

        scatterInst.current.setOption({
          backgroundColor: '#0f172a',
          textStyle: { fontFamily: '"Calibre", "Calibri", "Microsoft YaHei", sans-serif' },
          title: {
            text: `价格变动百分比 vs 出货速度变动相关性象限图 (已选 ${activeEnabledRows.length} 款)`,
            subtext: '左上：降价大幅起量 (高弹性促销) | 左下：降价未见起量 (虚弱SKU) | 右上：提价依然强劲 (品牌溢价)',
            textStyle: { color: '#f8fafc', fontSize: 13, fontWeight: 700, fontFamily: '"Calibre", "Calibri", "Microsoft YaHei"' },
            subtextStyle: { color: '#94a3b8', fontSize: 11, fontFamily: '"Calibre", "Calibri", "Microsoft YaHei"' },

          },
          tooltip: {

            backgroundColor: '#1e293b',

            }
          },
          grid: { left: '5%', right: '5%', bottom: '12%', top: '22%', containLabel: true },
          xAxis: {

            nameLocation: 'middle',

            nameTextStyle: { color: '#94a3b8', fontFamily: '"Calibre", "Calibri", "Microsoft YaHei"' },
            splitLine: { lineStyle: { color: '#334155', type: 'dashed' } },
            axisLine: { lineStyle: { color: '#475569' } },
            axisLabel: { color: '#94a3b8', formatter: '{value}%', fontFamily: '"Calibre", "Calibri"' }
          },
          yAxis: {
            name: '速度变化 (件/天)',
            nameTextStyle: { color: '#94a3b8', fontFamily: '"Calibre", "Calibri", "Microsoft YaHei"' },
            splitLine: { lineStyle: { color: '#334155', type: 'dashed' } },
            axisLine: { lineStyle: { color: '#475569' } },
            axisLabel: { color: '#94a3b8', formatter: '{value}', fontFamily: '"Calibre", "Calibri"' }
          },
          series: [{
            type: 'scatter',
            symbolSize: 18,
            data: scatterData,
            itemStyle: {
              color: (param) => {
                const diff = param.value ? param.value[1] : 0;
                return diff > 0 ? '#22c55e' : (diff < 0 ? '#ef4444' : '#94a3b8');
              },
              shadowBlur: 8,
              shadowColor: 'rgba(0,0,0,0.5)'
            },
            label: {
              show: true,
              formatter: (p) => p.value[2],
              position: 'top',
              color: '#cbd5e1',
              fontSize: 11,
              fontFamily: '"Calibre", "Calibri"'
            }
          }]
        }, true);
        scatterInst.current.resize();
      }

      // 2. 调价区间出货速度差对比图
      if (velocityDiffChartRef.current && timeIntervals.length > 1) {
        if (!velocityDiffChartInst.current) {
          velocityDiffChartInst.current = echarts.init(velocityDiffChartRef.current);
        }

        const currInter = timeIntervals[selectedCompareIdx] || timeIntervals[1];
        const prevInter = timeIntervals[selectedCompareIdx - 1] || timeIntervals[0];

        const currDays = Math.max(1, Math.ceil((new Date(currInter.end) - new Date(currInter.start)) / 86400000) + 1);
        const prevDays = Math.max(1, Math.ceil((new Date(prevInter.end) - new Date(prevInter.start)) / 86400000) + 1);

        const activeSkusList = activeEnabledRows.map(r => r.sku);

        const calcDiffForChannel = (filterFn) => {
          return activeSkusList.map(sku => {
            const prevCount = salesData
              .filter(s => s.sku === sku && filterFn(s) && s.date >= prevInter.start && s.date <= prevInter.end && (!onlyPositive || isPositiveStatus(s.status)))
              .reduce((acc, c) => acc + c.qty, 0);

            const currCount = salesData
              .filter(s => s.sku === sku && filterFn(s) && s.date >= currInter.start && s.date <= currInter.end && (!onlyPositive || isPositiveStatus(s.status)))
              .reduce((acc, c) => acc + c.qty, 0);

            const vPrev = prevCount / prevDays;
            const vCurr = currCount / currDays;
            return Number((vCurr - vPrev).toFixed(2));
          });
        };

        const diffAmazonAll = calcDiffForChannel(s => s.channel === 'Amazon');
        const diffAmazonVoltz = calcDiffForChannel(s => s.channel === 'Amazon' && s.account === 'Voltz');
        const diffAmazonDaan = calcDiffForChannel(s => s.channel === 'Amazon' && s.account === 'DAAN');
        const diffShopifyVoltz = calcDiffForChannel(s => s.channel === 'Shopify' && s.account === 'Voltz');

        const diffOption = {
          backgroundColor: '#0f172a',
          textStyle: { fontFamily: '"Calibre", "Calibri", "Microsoft YaHei", sans-serif' },
          title: {
            text: `各渠道出货速度变动对比 (${currInter.label} vs ${prevInter.label}) - 已选 ${activeSkusList.length} 款`,
            subtext: '纵轴：出货速度差值 (件/天，正数代表加速，负数代表减速) | 横轴：产品 SKU',
            textStyle: { color: '#f8fafc', fontSize: 13, fontWeight: 700, fontFamily: '"Calibre", "Calibri", "Microsoft YaHei"' },
            subtextStyle: { color: '#94a3b8', fontSize: 11, fontFamily: '"Calibre", "Calibri", "Microsoft YaHei"' },
            left: 10, top: 10
          },
          tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'shadow' },
            backgroundColor: '#1e293b',
            borderColor: '#475569',
            textStyle: { color: '#f8fafc', fontFamily: '"Calibre", "Calibri", "Microsoft YaHei"' },
            formatter: (params) => {
              if (!params || params.length === 0) return '';
              let html = `<b>SKU: ${params[0].axisValue}</b><br/>`;
              params.forEach(p => {
                const val = p.value;
                const sign = val > 0 ? '+' : '';
                html += `<span style="color:${p.color}">●</span> ${p.seriesName}: <b>${sign}${val} 件/天</b><br/>`;
              });
              return html;
            }
          },
          legend: {
            data: ['Amazon (全平台)', 'Amazon Voltz', 'Amazon DAAN', 'Shopify Voltz'],
            top: 10,
            right: 20,
            textStyle: { color: '#94a3b8', fontWeight: 600, fontFamily: '"Calibre", "Calibri", "Microsoft YaHei"' }
          },
          grid: { left: '4%', right: '4%', bottom: '15%', top: '20%', containLabel: true },
          xAxis: {
            type: 'category',
            data: activeSkusList,
            axisLabel: { color: '#94a3b8', interval: 0, rotate: 30, fontSize: 12, fontFamily: '"Calibre", "Calibri"' },
            axisLine: { lineStyle: { color: '#475569' } }
          },
          yAxis: {
            type: 'value',
            name: '速度差 (件/天)',
            axisLabel: { color: '#94a3b8', formatter: '{value}', fontFamily: '"Calibre", "Calibri"' },
            splitLine: { lineStyle: { color: '#334155', type: 'dashed' } }
          },
          series: [
            {
              name: 'Amazon (全平台)',
              type: 'bar',
              data: diffAmazonAll,
              itemStyle: { color: '#f59e0b', borderRadius: [3, 3, 0, 0] }
            },
            {
              name: 'Amazon Voltz',
              type: 'bar',
              data: diffAmazonVoltz,
              itemStyle: { color: '#38bdf8', borderRadius: [3, 3, 0, 0] }
            },
            {
              name: 'Amazon DAAN',
              type: 'bar',
              data: diffAmazonDaan,
              itemStyle: { color: '#a855f7', borderRadius: [3, 3, 0, 0] }
            },
            {
              name: 'Shopify Voltz',
              type: 'bar',
              data: diffShopifyVoltz,
              itemStyle: { color: '#10b981', borderRadius: [3, 3, 0, 0] }
            }
          ]
        };

        velocityDiffChartInst.current.setOption(diffOption, true);
        velocityDiffChartInst.current.resize();
      }
    };

    useEffect(() => {
      const timer = setTimeout(() => {
        if (activeTab === 'tab2') {
          renderTab2Chart();
        } else if (activeTab === 'tab3') {
          renderTab3Charts();
        }
      }, 60);

      return () => clearTimeout(timer);
    }, [activeTab, activeEnabledRows, detailSku, salesData, onlyPositive, selectedCompareIdx, timeIntervals, inventoryMap, selectedInvMetric]);

    useEffect(() => {
      const handleResize = () => {
        if (activeTab === 'tab2') chartInst.current?.resize();
        if (activeTab === 'tab3') {
          scatterInst.current?.resize();
          velocityDiffChartInst.current?.resize();
        }
      };
      window.addEventListener('resize', handleResize);
      return () => window.removeEventListener('resize', handleResize);
    }, [activeTab]);

    const renderSortArrow = (key, intervalId = null) => {
      if (sortConfig.key === key && sortConfig.intervalId === intervalId) {
        return sortConfig.direction === 'asc' ? ' ▲' : ' ▼';
      }
      return ' ↕';
    };

    // 当前选中的 SKU 详情
    const selectedDetailRow = useMemo(() => {
      return rawTableRows.find(r => r.sku === detailSku);
    }, [rawTableRows, detailSku]);

    return (
      <div>
        {/* 头部与版本号 */}
        <div className="header">
          <div>
            <div className="header-title-row">
              <h1>Voltz Toys 出货速度与调价复盘系统</h1>
              <span className="rev-badge">REV: {CURRENT_REV}</span>
            </div>
            <p>Multi-Interval Pricing, Daily Shipping Velocity & Inventory Run-Out Analytics</p>
          </div>

          <div style={{ display: 'flex', gap: '0.6rem', alignItems: 'center', flexWrap: 'wrap' }}>
            <button className="btn" onClick={() => setIsRevModalOpen(true)}>
              📜 REV History
            </button>
            <button className="btn btn-success" onClick={() => setIsAddModalOpen(true)}>
              ➕ 添加 PRODUCT
            </button>
            <button className="btn btn-danger" onClick={handleResetStorage} title="重置本地持久化缓存">
              🗑️ 重置数据
            </button>
          </div>
        </div>

        {/* 顶部多选与状态控制条 */}
        <div className="control-panel">
          <div style={{ display: 'flex', gap: '1rem', alignItems: 'center', flexWrap: 'wrap' }}>
            <MultiSelect title="Platform" options={allChannels} selected={selectedChannels} onChange={setSelectedChannels} />
            <div style={{ width: '1px', height: '24px', background: 'var(--border)' }}></div>
            <MultiSelect title="Vendor" options={allAccounts} selected={selectedAccounts} onChange={setSelectedAccounts} />
            <div style={{ width: '1px', height: '24px', background: 'var(--border)' }}></div>

            <label style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', fontSize: '0.85rem', color: '#cbd5e1', cursor: 'pointer' }}>
              <input

              <span>仅有效发货 (PositiveStatus)</span>
            </label>

            <div style={{ width: '1px', height: '24px', background: 'var(--border)' }}></div>

            {/* 库存列选择器 */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', fontSize: '0.85rem' }}>

                style={{

                  border: '1px solid var(--border)',
                  color: 'var(--primary)',
                  padding: '0.4rem 0.6rem',
                  borderRadius: '6px',
                  fontSize: '0.85rem',
                  fontWeight: 600,
                  cursor: 'pointer'
                }}
              >
                <option value="Quantity Available">Quantity Available (可用库存)</option>
                <option value="Quantity in Warehouse">Quantity in Warehouse (仓库库存)</option>
                <option value="Quantity Reserved">Quantity Reserved (预留/锁定)</option>
                <option value="Quantity Incoming">Quantity Incoming (在途补货)</option>
              </select>
            </div>
          </div>

          <div className="nav-tabs">
            <button className={`tab-btn ${activeTab === 'tab1' ? 'active' : ''}`} onClick={() => setActiveTab('tab1')}>
              多调价对比矩阵
            </button>
            <button className={`tab-btn ${activeTab === 'tab2' ? 'active' : ''}`} onClick={() => setActiveTab('tab2')}>
              单 SKU 阶梯图表 ({detailSku})
            </button>
            <button className={`tab-btn ${activeTab === 'tab3' ? 'active' : ''}`} onClick={() => setActiveTab('tab3')}>
              全局洞察与渠道弹性对比 📊
            </button>
          </div>
        </div>

        {/* 速度与库存统计卡片栏 */}
        <div className="summary-grid">
          <div className="summary-card" style={{ borderLeft: '4px solid var(--success)' }}>
            <div>
              <div className="title">出货速度上升 (Speed Up)</div>
              <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', marginTop: '2px' }}>
                平均提速: <strong style={{ color: 'var(--success)' }}>+{velocitySummary.avgUp} 件/天</strong>
              </div>
            </div>
            <div className="val" style={{ color: 'var(--success)' }}>{velocitySummary.speedUp} <span style={{ fontSize: '0.9rem' }}>款</span></div>
          </div>

          <div className="summary-card" style={{ borderLeft: '4px solid var(--danger)' }}>
            <div>
              <div className="title">出货速度放缓 (Speed Down)</div>

            <div className="val" style={{ color: 'var(--danger)' }}>{velocitySummary.speedDown} <span style={{ fontSize: '0.9rem' }}>款</span></div>

          <div className="summary-card" style={{ borderLeft: '4px solid var(--primary)' }}>

                占已选库容: <strong style={{ color: 'var(--primary)' }}>{((velocitySummary.speedFlat / Math.max(velocitySummary.totalActive, 1)) * 100).toFixed(0)}%</strong>
              </div>
            </div>
            <div className="val" style={{ color: 'var(--text-muted)' }}>{velocitySummary.speedFlat} <span style={{ fontSize: '0.9rem' }}>款</span></div>
          </div>

          <div className="summary-card" style={{ borderLeft: '4px solid var(--warning)' }}>
            <div>
              <div className="title">库存数据状态</div>
              <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', marginTop: '2px' }}>
                {inventoryExportTime ? `快照: ${inventoryExportTime}` : '暂未上传库存 CSV'}
              </div>
            </div>
            <div className="val" style={{ color: 'var(--warning)', fontSize: '1.4rem' }}>
              {Object.keys(inventoryMap).length > 0 ? `${Object.keys(inventoryMap).length} 品聚合` : '待匹配'}
            </div>
          </div>
        </div>

        {/* CSV 上传通道行 */}
        <div className="control-panel" style={{ padding: '0.85rem 1.25rem' }}>
          <div style={{ display: 'flex', gap: '1rem', alignItems: 'center', flexWrap: 'wrap' }}>
            {/* 1. 销售订单 */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', fontSize: '0.83rem' }}>
              <span style={{ color: 'var(--text-muted)' }}>1. 订单 Raw Data:</span>
              <label className="btn" style={{ padding: '0.35rem 0.65rem', fontSize: '0.8rem' }}>
                <span>📁 上传 CSV</span>
                <input type="file" accept=".csv" onChange={e => handleCsvUpload(e, 'sales')} style={{ display: 'none' }} />
              </label>
              <span style={{ color: 'var(--text-muted)', fontSize: '0.78rem' }}>({salesData.length} 条已存)</span>
            </div>

            <div style={{ width: '1px', height: '20px', background: 'var(--border)' }}></div>

            {/* 2. 调价历史 */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', fontSize: '0.83rem' }}>
              <span style={{ color: 'var(--text-muted)' }}>2. 调价记录:</span>
              <label className="btn" style={{ padding: '0.35rem 0.65rem', fontSize: '0.8rem' }}>
                <span>📁 上传 CSV</span>
                <input type="file" accept=".csv" onChange={e => handleCsvUpload(e, 'prices')} style={{ display: 'none' }} />
              </label>
            </div>

            <div style={{ width: '1px', height: '20px', background: 'var(--border)' }}></div>

            {/* 3. 现有库存数据 */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', fontSize: '0.83rem' }}>
              <span style={{ color: 'var(--emerald)', fontWeight: 700 }}>3. 现存库存 Data:</span>
              <label className="btn btn-success" style={{ padding: '0.35rem 0.65rem', fontSize: '0.8rem' }}>
                <span>📦 上传库存 CSV</span>
                <input type="file" accept=".csv" onChange={e => handleCsvUpload(e, 'inventory')} style={{ display: 'none' }} />
              </label>
              {inventoryExportTime && (
                <span style={{ color: 'var(--emerald)', fontSize: '0.78rem' }}>
                  (已同步: {inventoryExportTime})
                </span>
              )}
            </div>
          </div>

          <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'center' }}>
            <input
              type="text"
              placeholder="🔍 搜索 SKU / 品类..."
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
              style={{
                background: '#0f172a',
                border: '1px solid var(--border)',
                borderRadius: '6px',
                padding: '0.45rem 0.75rem',
                color: '#fff',
                fontSize: '0.85rem',
                width: '180px'
              }}
            />
            <button className="btn btn-primary" onClick={handleExportCSV}>
              📥 导出已选报表 (CSV)
            </button>
          </div>
        </div>

        {/* TAB 1: 汇总对比表格 */}
        <div style={{ display: activeTab === 'tab1' ? 'block' : 'none' }}>
          <div className="table-container">
            <table>
              <thead>
                <tr style={{ background: '#1e293b', textAlign: 'center', fontWeight: 700 }}>

                      checked={enabledSkus.length === allSkusList.length && allSkusList.length > 0}

                    库存与去化周期 ({selectedInvMetric})
                  </th>
                  {timeIntervals.map((inter, idx) => (

                      style={{

                      }}

                      {inter.label} {idx === 0 ? '(基准期)' : ''}

                </tr>
                <tr style={{ background: '#0f172a', fontWeight: 600, fontSize: '0.78rem' }}>
                  <th style={{ textAlign: 'center', color: 'var(--text-muted)' }}>启用</th>
                  <th onClick={() => handleSort('sku')} style={{ textAlign: 'left', cursor: 'pointer' }}>

                  <th onClick={() => handleSort('itemType')} style={{ textAlign: 'left', borderRight: '1px solid var(--border)', cursor: 'pointer' }}>

              <div className="kpi-card" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', textTransform: 'uppercase' }}>当前复盘商品</div>
                  <select
                    value={detailSku}
                    onChange={e => setDetailSku(e.target.value)}
                    style={{
                      background: 'transparent',
                      border: 'none',
                      color: '#fff',
                      fontSize: '1.45rem',
                      fontWeight: 800,
                      marginTop: '4px',
                      cursor: 'pointer'
                    }}
                  >
                    {allSkusList.map(s => <option key={s} value={s} style={{ background: 'var(--card-bg)' }}>{s} {enabledSkus.includes(s) ? '' : '(已排除)'}</option>)}
                  </select>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>最新生效价格</div>
                  <div style={{ fontSize: '1.35rem', fontWeight: 800, color: 'var(--emerald)' }}>
                    ${getPriceAtDate(detailSku, '2099-12-31').toFixed(2)}
                  </div>
                </div>
              </div>

              {/* TAB 2 同步卡片 1: 所选口径库存量 */}
              <div className="kpi-card" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', textTransform: 'uppercase' }}>匹配库存量</div>
                  <div style={{ fontSize: '0.78rem', color: 'var(--emerald)', marginTop: '2px' }}>{selectedInvMetric}</div>
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>{inventoryExportTime || '未检测到时间'}</div>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <div style={{ fontSize: '1.45rem', fontWeight: 800, color: 'var(--emerald)' }}>
                    {selectedDetailRow?.currentInv !== null && selectedDetailRow?.currentInv !== undefined ? selectedDetailRow.currentInv : '--'}
                    <span style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginLeft: '4px' }}>件</span>
                  </div>
                </div>
              </div>

              {/* TAB 2 同步卡片 2: 预计消耗天数 */}
              <div className="kpi-card" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', textTransform: 'uppercase' }}>调整后消耗完天数</div>
                  <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', marginTop: '2px' }}>
                    按最新速度: <strong style={{ color: 'var(--primary)' }}>{selectedDetailRow?.latestSpeed || 0} 件/天</strong>
                  </div>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <div style={{ fontSize: '1.45rem', fontWeight: 800, color: selectedDetailRow?.daysToExhaust <= 15 ? 'var(--danger)' : 'var(--primary)' }}>
                    {selectedDetailRow?.daysToExhaust !== null && selectedDetailRow?.daysToExhaust !== undefined ? (
                      selectedDetailRow.daysToExhaust >= 99999 ? '∞ (停滞)' : `${selectedDetailRow.daysToExhaust} 天`
                    ) : '--'}
                  </div>
                </div>
              </div>

              <div className="kpi-card" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', textTransform: 'uppercase' }}>价格时光机验证器</div>
                  <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', marginTop: '2px' }}>T 日老价格，T+1 生效新价格</div>
                  <input
                    type="date"
                    value={queryDate}
                    onChange={e => setQueryDate(e.target.value)}
                    style={{
                      background: '#0f172a',
                      border: '1px solid var(--border)',
                      borderRadius: '6px',
                      color: '#fff',
                      padding: '0.35rem 0.5rem',
                      fontSize: '0.8rem',
                      marginTop: '6px'
                    }}
                  />
                </div>
                <div style={{ textAlign: 'right' }}>
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>执行价格</div>
                  <div style={{ fontSize: '1.45rem', fontWeight: 800, color: 'var(--warning)' }}>
                    ${checkedPrice !== null ? checkedPrice.toFixed(2) : '--'}
                  </div>
                </div>
              </div>
            </div>

            <div style={{ background: '#0f172a', border: '1px solid var(--border)', borderRadius: '12px', padding: '1rem' }}>
              <div ref={chartRef} style={{ width: '100%', height: '420px', minHeight: '420px' }}></div>
            </div>
          </div>
        </div>

        {/* TAB 3: 全局洞察 */}
        <div style={{ display: activeTab === 'tab3' ? 'block' : 'none' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
            <div style={{ background: '#0f172a', border: '1px solid var(--border)', borderRadius: '12px', padding: '1.25rem' }}>
              <div ref={scatterRef} style={{ width: '100%', height: '380px', minHeight: '380px' }}></div>
            </div>

            <div style={{ background: '#0f172a', border: '1px solid var(--border)', borderRadius: '12px', padding: '1.25rem' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem', flexWrap: 'wrap', gap: '0.75rem' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                  <span style={{ fontSize: '0.9rem', fontWeight: 700, color: 'var(--primary)' }}>
                    📊 调价区间出货速度差对比 (Velocity Diff Analysis)
                  </span>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', fontSize: '0.85rem' }}>
                    <span style={{ color: 'var(--text-muted)' }}>选择对比切片区间:</span>
                    <select
                      value={selectedCompareIdx}
                      onChange={e => setSelectedCompareIdx(Number(e.target.value))}
                      style={{
                        background: '#1e293b',
                        border: '1px solid var(--border)',
                        borderRadius: '6px',
                        color: '#f8fafc',
                        padding: '0.35rem 0.65rem',
                        fontSize: '0.85rem',
                        fontWeight: 600,
                        cursor: 'pointer'
                      }}
                    >
                      {timeIntervals.map((inter, idx) => {
                        if (idx === 0) return null;
                        return (
                          <option key={inter.id} value={idx}>
                            {inter.label} vs {timeIntervals[idx - 1].label}
                          </option>
                        );
                      })}
                    </select>
                  </div>
                </div>

                <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                  已选 <strong>{activeEnabledRows.length}</strong> 款纳入对比 | 点击图例可单独显示/隐藏渠道
                </div>
              </div>

              <div ref={velocityDiffChartRef} style={{ width: '100%', height: '440px', minHeight: '440px' }}></div>
            </div>
          </div>
        </div>

        {/* 底部修订版本管理栏 */}
        <div className="footer-rev-bar">
          <div>
            当前系统构建版本：<code>REV: {CURRENT_REV}</code> (YYMMDDHHMM)
          </div>
          <div>
            <button className="btn" onClick={handleDownloadRevHistory}>
              📥 下载修订历史 (Rev History .txt)
            </button>
          </div>
        </div>

        {/* REV History 模态弹窗 */}
        {isRevModalOpen && (
          <div style={{
            position: 'fixed',
            inset: 0,
            background: 'rgba(0,0,0,0.7)',
            backdropFilter: 'blur(4px)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            zIndex: 100,
            padding: '1.5rem'
          }}>
            <div style={{
              background: 'var(--card-bg)',
              border: '1px solid var(--border)',
              borderRadius: '16px',
              maxWidth: '720px',
              width: '100%',
              padding: '1.5rem',
              boxShadow: '0 20px 30px rgba(0,0,0,0.6)',
              display: 'flex',
              flexDirection: 'column',
              maxHeight: '85vh'
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid var(--border)', paddingBottom: '0.75rem' }}>
                <h3 style={{ fontSize: '1.15rem', fontWeight: 700, color: '#fff' }}>系统版本修订历史 (Revision History)</h3>
                <button onClick={() => setIsRevModalOpen(false)} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', fontSize: '1.4rem', cursor: 'pointer' }}>×</button>
              </div>

              <pre style={{
                margin: '1rem 0',
                padding: '1rem',
                background: '#0f172a',
                border: '1px solid var(--border)',
                borderRadius: '8px',
                color: 'var(--primary)',
                fontFamily: '"Calibre", "Calibri", monospace',
                fontSize: '0.85rem',
                lineHeight: 1.5,
                overflowY: 'auto',
                flex: 1
              }}>
                {REV_HISTORY_TEXT}
              </pre>

              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '0.75rem', borderTop: '1px solid var(--border)', paddingTop: '0.75rem' }}>
                <button className="btn" onClick={() => setIsRevModalOpen(false)}>关闭</button>
                <button className="btn btn-primary" onClick={handleDownloadRevHistory}>📥 下载 .txt 文件</button>
              </div>
            </div>
          </div>
        )}

        {/* 添加 Product 弹窗 */}
        {isAddModalOpen && (
          <div style={{
            position: 'fixed',
            inset: 0,
            background: 'rgba(0,0,0,0.7)',
            backdropFilter: 'blur(4px)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            zIndex: 100,
            padding: '1.5rem'
          }}>
            <div style={{
              background: 'var(--card-bg)',
              border: '1px solid var(--border)',
              borderRadius: '16px',
              maxWidth: '440px',
              width: '100%',
              padding: '1.5rem',
              boxShadow: '0 20px 30px rgba(0,0,0,0.6)'
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid var(--border)', paddingBottom: '0.75rem' }}>
                <h3 style={{ fontSize: '1.1rem', fontWeight: 700, color: '#fff' }}>添加新 PRODUCT</h3>
                <button onClick={() => setIsAddModalOpen(false)} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', fontSize: '1.4rem', cursor: 'pointer' }}>×</button>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '0.85rem', margin: '1rem 0' }}>
                <div>
                  <label style={{ fontSize: '0.8rem', color: 'var(--text-muted)', display: 'block', marginBottom: '4px' }}>SKU 编码:</label>
                  <input
                    type="text"
                    value={newSku}
                    placeholder="例如: 86388"
                    onChange={e => setNewSku(e.target.value)}
                    style={{ width: '100%', background: '#0f172a', border: '1px solid var(--border)', borderRadius: '6px', padding: '0.5rem 0.75rem', color: '#fff', fontSize: '0.88rem' }}
                  />
                </div>
                <div>
                  <label style={{ fontSize: '0.8rem', color: 'var(--text-muted)', display: 'block', marginBottom: '4px' }}>品类 (Item Type):</label>
                  <input
                    type="text"
                    value={newType}
                    onChange={e => setNewType(e.target.value)}
                    style={{ width: '100%', background: '#0f172a', border: '1px solid var(--border)', borderRadius: '6px', padding: '0.5rem 0.75rem', color: '#fff', fontSize: '0.88rem' }}
                  />
                </div>
                <div>
                  <label style={{ fontSize: '0.8rem', color: 'var(--text-muted)', display: 'block', marginBottom: '4px' }}>初始价格 ($):</label>
                  <input
                    type="number"
                    value={newBasePrice}
                    onChange={e => setNewBasePrice(e.target.value)}
                    style={{ width: '100%', background: '#0f172a', border: '1px solid var(--border)', borderRadius: '6px', padding: '0.5rem 0.75rem', color: '#fff', fontSize: '0.88rem' }}
                  />
                </div>
              </div>

              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '0.75rem', borderTop: '1px solid var(--border)', paddingTop: '0.75rem' }}>
                <button className="btn" onClick={() => setIsAddModalOpen(false)}>取消</button>
                <button
                  className="btn btn-primary"
                  onClick={() => {
                    const s = newSku.trim();
                    if (!s) return;
                    if (!allSkusList.includes(s)) {
                      setAllSkusList([...allSkusList, s]);
                      setEnabledSkus([...enabledSkus, s]);
                    }
                    setPriceData(prev => [...prev, { sku: s, date: '2026-07-01', price: Number(newBasePrice) || 100, itemType: newType }]);
                    setIsAddModalOpen(false);
                    setNewSku('');
                  }}
                >
                  确认添加
                </button>
              </div>
            </div>
          </div>
        )}

      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
