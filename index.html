  function parseCSV(text) {
    const rows = [];
    let currentRow = [];
    let currentVal = '';
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];

      if (char === '"') {
        if (insideQuotes && nextChar === '"') {
          currentVal += '"';
          i++;
        } else {
          insideQuotes = !insideQuotes;
        }
      } else if (char === ',' && !insideQuotes) {
        currentRow.push(currentVal.trim());
        currentVal = '';
      } else if ((char === '\r' || char === '\n') && !insideQuotes) {
        if (char === '\r' && nextChar === '\n') i++;
        currentRow.push(currentVal.trim());
        if (currentRow.some(c => c.length > 0)) rows.push(currentRow);
        currentRow = [];
        currentVal = '';
      } else {
        currentVal += char;
      }
    }
    if (currentVal.length > 0 || currentRow.length > 0) {
      currentRow.push(currentVal.trim());
      if (currentRow.some(c => c.length > 0)) rows.push(currentRow);
    }
    return rows;
  }

  function MultiSelect({ title, options, selected, onChange }) {
    const [open, setOpen] = useState(false);
    const ref = useRef(null);

    useEffect(() => {
      const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };

      return () => document.removeEventListener('mousedown', handler);
    }, []);

    const toggle = (opt) => {

        onChange([...selected, opt]);

      const history = priceData
        .filter(p => p.sku === sku)
        .sort((a, b) => a.date.localeCompare(b.date));

      if (history.length === 0) return 0;
      let p = history[0].price;
      for (const log of history) {
        if (targetDate > log.date) {
          p = log.price;
        }
      }
      return p;
    };

          { id: 'P2', start: '2026-09-18', end: '2026-09-24', label: 'P2 (09-18~09-24)' }
        ];
      }

      const validDates = salesData.map(s => s.date).filter(Boolean).sort();
      if (validDates.length === 0) return [];
      const minDate = validDates[0];
      const maxDate = validDates[validDates.length - 1];

      const validCuts = cutDates.filter(d => d >= minDate && d < maxDate).sort();
      const intervals = [];
      let currStart = minDate;

      validCuts.forEach((cutDate, idx) => {
        intervals.push({
          id: `P${idx + 1}`,
          start: currStart,
          end: cutDate,
          label: `P${idx + 1} (${currStart.slice(5)}~${cutDate.slice(5)})`
        });
        const next = new Date(cutDate);
        next.setDate(next.getDate() + 1);
        currStart = next.toISOString().split('T')[0];
      });

      if (currStart <= maxDate) {
        intervals.push({
          id: `P${validCuts.length + 1}`,
          start: currStart,
          end: maxDate,
          label: `P${validCuts.length + 1} (${currStart.slice(5)}~${maxDate.slice(5)})`
        });
      }
      return intervals;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const text = evt.target.result;
        const rows = parseCSV(text);
        if (rows.length <= 1) return;

        const headers = rows[0].map(h => h.trim());

        if (type === 'sales') {
          const dateIdx = headers.indexOf('Date');
          const skuIdx = headers.indexOf('Product') !== -1 ? headers.indexOf('Product') : headers.indexOf('sku');
          const channelIdx = headers.indexOf('Base Channel') !== -1 ? headers.indexOf('Base Channel') : headers.indexOf('channel');
          const accountIdx = headers.indexOf('Account') !== -1 ? headers.indexOf('Account') : headers.indexOf('account');
          const statusIdx = headers.indexOf('Status') !== -1 ? headers.indexOf('Status') : headers.indexOf('status');
          const revIdx = headers.indexOf('Gross Revenue') !== -1 ? headers.indexOf('Gross Revenue') : headers.indexOf('rev');

          const cleanSales = [];
          const chSet = new Set();
          const accSet = new Set();

          for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            const dateVal = r[dateIdx];
            const skuVal = r[skuIdx];
            if (!dateVal || !skuVal || dateVal.length < 8) continue;

            const ch = r[channelIdx] || 'Other';
            const acc = r[accountIdx] || 'Other';
            const status = r[statusIdx] || '';
            const rev = parseFloat(r[revIdx]) || 0;

            cleanSales.push({ date: dateVal, sku: skuVal, channel: ch, account: acc, status, qty: 1, rev });
            chSet.add(ch);
            accSet.add(acc);
          }

          setSalesData(cleanSales);
          setAllChannels(Array.from(chSet));
          setAllAccounts(Array.from(accSet));
          alert(`成功导入销售 Raw Data: ${cleanSales.length} 条记录！数据已自动保存在本地。`);
        } else if (type === 'prices') {
          const cleanPrices = [];
          const newCuts = new Set(cutDates);

          for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            const sku = r[0];
            const date = r[1];
            const price = parseFloat(r[2]) || 0;
            const itemType = r[4] || 'Ride-on Car';

            if (sku && date) {
              cleanPrices.push({ sku, date, price, itemType });
              newCuts.add(date);
            }
          }

          setPriceData(prev => [...prev, ...cleanPrices]);
          setCutDates(Array.from(newCuts));
          alert(`成功追加调价记录: ${cleanPrices.length} 条！数据已自动保存在本地。`);
        }
      };
      reader.readAsText(file);
    };

    const rawTableRows = useMemo(() => {
      return selectedSkus.map(sku => {
        const itemType = priceData.find(p => p.sku === sku)?.itemType || 'Ride-on Car';

        const skuSales = salesData.filter(s =>
          s.sku === sku &&
          selectedChannels.includes(s.channel) &&
          selectedAccounts.includes(s.account) &&
          (!onlyPositive || isPositiveStatus(s.status))
        );

        let prevSpeed = null;

        const intervalMetrics = timeIntervals.map((inter, idx) => {
          const inRange = skuSales.filter(s => s.date >= inter.start && s.date <= inter.end);
          const val = inRange.reduce((acc, cur) => acc + cur.rev, 0);
          const count = inRange.reduce((acc, cur) => acc + cur.qty, 0);
          const days = Math.max(1, Math.ceil((new Date(inter.end) - new Date(inter.start)) / 86400000) + 1);

          const avgSpeed = Number((count / days).toFixed(2));
          const activePrice = getPriceAtDate(sku, inter.end);

          let diffWithPrev = null;
          if (idx > 0 && prevSpeed !== null) {
            diffWithPrev = Number((avgSpeed - prevSpeed).toFixed(2));
          }
          prevSpeed = avgSpeed;

          return {
            id: inter.id,
            val: Number(val.toFixed(2)),
            count: Number(count.toFixed(2)),
            avgSpeed: Number(avgSpeed.toFixed(2)),
            diffWithPrev,
            activePrice
          };
        });

        const firstP = intervalMetrics[0]?.activePrice || 0;
        const lastP = intervalMetrics[intervalMetrics.length - 1]?.activePrice || 0;
        const priceChangePct = firstP > 0 ? Number((((lastP - firstP) / firstP) * 100).toFixed(1)) : 0;

        const firstSpeed = intervalMetrics[0]?.avgSpeed || 0;
        const lastSpeed = intervalMetrics[intervalMetrics.length - 1]?.avgSpeed || 0;
        const totalSpeedDiff = Number((lastSpeed - firstSpeed).toFixed(2));

        return { sku, itemType, intervalMetrics, priceChangePct, totalSpeedDiff };
      });
    }, [selectedSkus, salesData, priceData, timeIntervals, selectedChannels, selectedAccounts, onlyPositive]);

    const sortedAndFilteredRows = useMemo(() => {
      let result = [...rawTableRows];

      if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        result = result.filter(r => r.sku.toLowerCase().includes(q) || r.itemType.toLowerCase().includes(q));
      }

      if (sortConfig.key) {
        result.sort((a, b) => {
          let valA, valB;
          if (sortConfig.key === 'sku') {
            valA = a.sku; valB = b.sku;
            return sortConfig.direction === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
          } else if (sortConfig.key === 'itemType') {
            valA = a.itemType; valB = b.itemType;
            return sortConfig.direction === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
          } else {
            const mA = a.intervalMetrics.find(m => m.id === sortConfig.intervalId);
            const mB = b.intervalMetrics.find(m => m.id === sortConfig.intervalId);
            valA = mA ? (mA[sortConfig.key] ?? -999999) : -999999;
            valB = mB ? (mB[sortConfig.key] ?? -999999) : -999999;
            return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
          }
        });
      }
      return result;
    }, [rawTableRows, searchQuery, sortConfig]);

    const velocitySummary = useMemo(() => {
      let speedUp = 0;
      let speedDown = 0;
      let speedFlat = 0;
      let totalUpDiff = 0;
      let totalDownDiff = 0;

      sortedAndFilteredRows.forEach(r => {
        if (r.totalSpeedDiff > 0) {
          speedUp++;
          totalUpDiff += r.totalSpeedDiff;
        } else if (r.totalSpeedDiff < 0) {
          speedDown++;
          totalDownDiff += Math.abs(r.totalSpeedDiff);
        } else {
          speedFlat++;
        }
      });

      const avgUp = speedUp > 0 ? (totalUpDiff / speedUp).toFixed(2) : '0.00';
      const avgDown = speedDown > 0 ? (totalDownDiff / speedDown).toFixed(2) : '0.00';

      return { speedUp, speedDown, speedFlat, avgUp, avgDown };

                    if (!s) return;
                    if (!selectedSkus.includes(s)) setSelectedSkus([...selectedSkus, s]);
                    setPriceData(prev => [...prev, { sku: s, date: '2026-07-01', price: Number(newBasePrice) || 100, itemType: newType }]);
                    setIsAddModalOpen(false);
                    setNewSku('');
                  }}
                >
                  确认添加
                </button>
              </div>
            </div>
          </div>
        )}

      </div>
    );
  }

  ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
